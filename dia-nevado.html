    <main>
        <h2>4. Día nevado soleado</h2>
        <div id="canvas-container"></div>
    </main>

    <footer>
        <p>© 2026 - Proyecto de Computación Gráfica</p>
    </footer>

    <script>
        function setup() {
            let canvas = createCanvas(400, 400);
            canvas.parent('canvas-container');
        }

        function draw() {
            background(156, 186, 255);
            noStroke();

            // El suelo
            fill(23, 156, 63);
            rect(0, 300, 400, 100);  

            // El sol
            fill(234, 255, 48);
            ellipse(80, 64, 100, 100);  

            // El muñeco de nieve
            fill(255, 255, 255);
            ellipse(200, 300, 150, 150);
            ellipse(200, 200, 100, 100);
            ellipse(200, 120, 75, 75);
        }
    </script>
</body>
