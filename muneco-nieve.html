        <p>© 2026 - Proyecto de Computación Gráfica</p>
    </footer>

    <script>
        function setup() {
            let canvas = createCanvas(400, 400);
            canvas.parent('canvas-container');
        }

        function draw() {
            background(200, 220, 255);
            stroke(0);
            fill(255);

            rect(0, 334, 399, 65); // Piso
            ellipse(200, 300, 150, 150); // Esfera inferior
            ellipse(200, 200, 100, 100); // Esfera intermedia 
            ellipse(200, 120, 75, 75);  // Esfera superior
            line(159, 192, 52, 96);   // Brazo izquierdo
            line(245, 192, 346, 96);  // Brazo derecho
        }
    </script>
