    <main>
        <h2>1. Rana</h2>
        <div id="canvas-container"></div>
    </main>

    <footer>
        <p>© 2026 - Proyecto de Computación Gráfica</p>
    </footer>

    <script>
        function setup() {
            let canvas = createCanvas(400, 400);
            canvas.parent('canvas-container');
        }

        function draw() {
            background(240);
            var x = 200;
            var y = 250;

            noStroke();
            fill(30, 204, 91); // verde de la rana

            ellipse(x, y, 200, 100); // cara
            ellipse(x - 50, y - 50, 40, 40); // ojo izquierdo
            ellipse(x + 50, y - 50, 40, 40); // ojo derecho

            fill(255, 255, 255); // blanco de los ojos
            ellipse(x - 50, y - 50, 30, 30); 
            ellipse(x + 50, y - 50, 30, 30); 

            fill(0, 0, 0);
            ellipse(x, y, 122, 57);

            rect(x - 50, y - 50, 10, 10);
            rect(x + 50, y - 50, 10, 10);
        }
    </script>
