    <main>
        <h2>2. Dientes de conejo</h2>
        <div id="canvas-container"></div>
    </main>

    <footer>
        <p>© 2026 - Proyecto de Computación Gráfica</p>
    </footer>

    <script>
        function setup() {
            let canvas = createCanvas(400, 400);
            canvas.parent('canvas-container');
        }

        function draw() {
            background(240);
            stroke(0);
            strokeWeight(1);
            fill(255);

            ellipse(150, 70, 60, 120);  // Oreja izquierda
            ellipse(240, 70, 60, 120);  // Oreja derecha

            ellipse(200, 170, 150, 150); // Cara

            var ojo = 24;
            fill(0, 0, 0);
            ellipse(170, 150, ojo, ojo); // Ojo izquierdo
            ellipse(230, 150, ojo, ojo); // Ojo derecho

            line(150, 200, 250, 200);   // Boca

            var largd = 40;
            noFill();
            rect(185, 200, 15, largd); // Diente izquierdo
            rect(200, 200, 15, largd); // Diente derecho
        }
    </script>
